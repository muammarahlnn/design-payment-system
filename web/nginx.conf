server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Everything is served from one origin, so the browser never makes a
    # cross-origin request and no CORS headers are needed anywhere in Go.
    # nginx forwards the two API prefixes to the right container.

    location /api/payments/ {
        proxy_pass http://payment-service:8080/;
        proxy_set_header Host $host;
    }

    location /api/gateway/ {
        proxy_pass http://fake-gateway:8082/;
        proxy_set_header Host $host;
        # The gateway's timeout fail mode hangs for 60s on purpose; let it,
        # so the UI shows the real behaviour instead of an nginx 504.
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

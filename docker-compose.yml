services:
  postgres:
    image: postgres:17-alpine
    container_name: dps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # Host port 5433, container port 5432.
      #
      # 5432 on this machine is taken by a native PostgreSQL 18 from the EDB
      # installer (/Library/PostgreSQL/18, started by a LaunchDaemon at boot),
      # so publishing there would clash or connect you to the wrong server.
      #
      # The left side comes from .env, which holds the HOST's view of the
      # database (localhost:5433). Containers do not use this mapping at all —
      # they reach Postgres at postgres:5432 over the Docker network, via the
      # DB_HOST/DB_PORT overrides in each service below.
      #
      # Syntax is HOST:CONTAINER. Only the LEFT number is yours to choose.
      # The right one must stay 5432: that is the port Postgres listens on
      # inside its own container, and changing it points the mapping at
      # nothing.
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.0.0
    container_name: dps-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      # Internal listener (other containers): kafka:9092
      # Host listener (your machine / CLI / GUI): localhost:29092
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Bind explicitly to 0.0.0.0 rather than leaving the host blank
      # (PLAINTEXT://:9092): a blank host makes Kafka's KRaft startup call
      # InetAddress.getLocalHost() to self-resolve the container's random
      # hostname, which fails if the Docker DNS resolver is flaky.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Without this, Kafka writes to its default /tmp/kafka-logs INSIDE the
      # container's writable layer, and the kafkadata volume below is never
      # used. Data then dies with the container, and a disk-full event
      # corrupts it with no way back.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10

  # Web UI for browsing Kafka topics (including the DLQ topics) and message
  # headers. Dev-only, no auth. http://localhost:8088
  kafka-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: dps-kafka-console
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8088:8080"
    depends_on:
      kafka:
        condition: service_healthy

  payment-service:
    build:
      context: .
      args:
        SERVICE: payment-service
    container_name: dps-payment-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_PORT: 8080
      # .env targets a local `go run` on the host, where Postgres is
      # localhost:5433. Inside the network it is postgres:5432.
      DB_HOST: postgres
      DB_PORT: 5432
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-worker:
    build:
      context: .
      args:
        SERVICE: payment-worker
    container_name: dps-payment-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      KAFKA_BROKERS: kafka:9092
      GATEWAY_URL: http://fake-gateway:8082
      # Overridable from the shell so the sweep can be made fast for testing:
      #   RECONCILE_STALE_AFTER=10s docker compose up -d payment-worker
      RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-30s}
      RECONCILE_STALE_AFTER: ${RECONCILE_STALE_AFTER:-2m}
      RECONCILE_EXPIRE_AFTER: ${RECONCILE_EXPIRE_AFTER:-30m}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      fake-gateway:
        condition: service_healthy

  fake-gateway:
    build:
      context: .
      args:
        SERVICE: fake-gateway
    container_name: dps-fake-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_PORT: 8082
      # Drive the failure knob from the shell without editing .env:
      #   GATEWAY_FAIL_MODE=decline docker compose up -d fake-gateway
      GATEWAY_FAIL_MODE: ${GATEWAY_FAIL_MODE:-}
      WEBHOOK_URL: http://payment-service:8080/webhook/payment
      GATEWAY_STORE_PATH: /data/charges.json
    volumes:
      # Charges must survive a restart, or reconciliation has nothing to ask.
      - gatewaydata:/data
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: ./web
    container_name: dps-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      payment-service:
        condition: service_healthy
      fake-gateway:
        condition: service_healthy

volumes:
  gatewaydata:
  pgdata:
  kafkadata:

services:
  postgres:
    image: postgres:17-alpine
    container_name: dps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # Containers reach Postgres at postgres:5432 on the Docker network;
      # this mapping is only for psql/DBeaver from your machine.
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.0.0
    container_name: dps-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      # Internal listener (other containers): kafka:9092
      # Host listener (your machine / CLI / GUI): localhost:29092
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Bind explicitly to 0.0.0.0 rather than leaving the host blank
      # (PLAINTEXT://:9092): a blank host makes Kafka's KRaft startup call
      # InetAddress.getLocalHost() to self-resolve the container's random
      # hostname, which fails if the Docker DNS resolver is flaky.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10

  # Web UI for browsing Kafka topics (including the DLQ topics) and message
  # headers. Dev-only, no auth. http://localhost:8088
  kafka-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: dps-kafka-console
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8088:8080"
    depends_on:
      kafka:
        condition: service_healthy

  payment-service:
    build:
      context: .
      args:
        SERVICE: payment-service
    container_name: dps-payment-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_PORT: 8080
      # .env targets a local `go run`; inside the network the hostnames differ.
      DB_HOST: postgres
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-worker:
    build:
      context: .
      args:
        SERVICE: payment-worker
    container_name: dps-payment-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_PORT: 8081
      DB_HOST: postgres
      KAFKA_BROKERS: kafka:9092
      GATEWAY_URL: http://fake-gateway:8082
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      fake-gateway:
        condition: service_healthy

  fake-gateway:
    build:
      context: .
      args:
        SERVICE: fake-gateway
    container_name: dps-fake-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_PORT: 8082
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
  kafkadata:
